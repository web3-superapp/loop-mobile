name: loop_mobile
description: LOOP Flutter mobile client skeleton.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.13.1 <4.0.0'

dependencies:
  connectivity_plus: 7.3.1
  decimal: 3.2.6
  dio: 5.11.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: 1.0.8
  firebase_core: 4.13.0
  firebase_messaging: 16.5.0
  flutter_inappwebview: 6.1.5
  flutter_secure_storage: 10.3.1
  flutter_riverpod: 3.4.2
  go_router: 17.5.0
  image_picker: 1.2.3
  # Decision 0281: gen-l10n's generated code imports intl; pinned to the
  # version the lockfile already resolved transitively.
  intl: 0.20.3
  local_auth: 3.0.2
  mobile_scanner: 7.4.2
  path_provider: 2.1.6
  privy_flutter: 0.11.0
  reown_appkit: 1.8.4
  share_plus: 12.0.2
  shared_preferences: 2.5.5
  stream_chat_flutter: 10.3.0
  stream_chat_persistence: 10.3.0
  stream_video_flutter: 1.4.3
  url_launcher: 6.3.2
  uuid: 4.6.0
  flutter_svg: 2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0

# sqlite3 v3 otherwise downloads a native artifact from GitHub during each
# cold build. Stream's pinned persistence graph already packages libsqlite3
# for Android, while Apple platforms provide it through the operating system.
hooks:
  user_defines:
    sqlite3:
      source: system

flutter:
  # Decision 0281: `flutter gen-l10n` (l10n.yaml) writes lib/l10n/gen.
  generate: true
  config:
    enable-swift-package-manager: false
  uses-material-design: true
  # Frozen prototype assets (docs/prototype, cliview.org loop-v2 build).
  assets:
    - assets/brand/
    - assets/tokens/
    - assets/networks/
    - assets/people/
    - assets/communities/
    - assets/icons/
    # Empty-state line illustrations (decision 0122), drawn for LOOP.
    - assets/illustrations/
    # The requester's Figma assets (decision 0277): the title doodle, the
    # crowns, the tab bar's glyphs and halo, the wallet glyphs.
    - assets/figma/
  # Decision 0277 (supersedes 0210's Anton / Arimo): the requester's Figma
  # system. Inter (SIL OFL 1.1, rsms/inter v4.1 static instances 300 / 400 /
  # 500 / 600 / 700 and Black Italic 900 for the 「第 N 名」 place) carries
  # every Latin letter and figure; Inter has no Han, so a Chinese run falls
  # through `fontFamilyFallback` to the bundled Noto Sans SC — three static
  # instances subset to the GB2312 repertoire plus CJK and fullwidth
  # punctuation (decision 0069). IBM Plex Mono stays registered for a real
  # code block; addresses and links are Inter since 0277.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Light.ttf
          weight: 300
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-BlackItalic.ttf
          weight: 900
          style: italic
    - family: Noto Sans SC
      fonts:
        - asset: assets/fonts/NotoSansSC-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansSC-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSansSC-Bold.ttf
          weight: 700
    - family: IBM Plex Mono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexMono-SemiBold.ttf
          weight: 600
