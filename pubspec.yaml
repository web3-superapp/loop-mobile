name: loop_mobile
description: LOOP Flutter mobile client skeleton.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.13.1 <4.0.0'

dependencies:
  connectivity_plus: 7.3.1
  decimal: 3.2.6
  dio: 5.11.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: 1.0.8
  firebase_core: 4.13.0
  firebase_messaging: 16.5.0
  flutter_secure_storage: 10.3.1
  flutter_riverpod: 3.4.2
  go_router: 17.5.0
  image_picker: 1.2.3
  local_auth: 3.0.2
  mobile_scanner: 7.4.2
  path_provider: 2.1.6
  privy_flutter: 0.11.0
  reown_appkit: 1.8.4
  share_plus: 12.0.2
  shared_preferences: 2.5.5
  stream_chat_flutter: 10.3.0
  stream_chat_persistence: 10.3.0
  stream_video_flutter: 1.4.3
  url_launcher: 6.3.2
  uuid: 4.6.0
  flutter_svg: 2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0

# sqlite3 v3 otherwise downloads a native artifact from GitHub during each
# cold build. Stream's pinned persistence graph already packages libsqlite3
# for Android, while Apple platforms provide it through the operating system.
hooks:
  user_defines:
    sqlite3:
      source: system

flutter:
  config:
    enable-swift-package-manager: false
  uses-material-design: true
  # Frozen prototype assets (docs/prototype, cliview.org loop-v2 build).
  assets:
    - assets/brand/
    - assets/tokens/
    - assets/networks/
    - assets/people/
    - assets/communities/
    - assets/icons/
    # Empty-state line illustrations (decision 0122), drawn for LOOP.
    - assets/illustrations/
  # Decision 0210 (supersedes 0080's platform sans): the looplabs.meme voice.
  # Anton (SIL OFL 1.1) stands in for Impact on every heading band and Arimo
  # (SIL OFL 1.1, Arial-metric compatible; static 400/700 instanced from the
  # upstream variable file) for Arial on every other proportional band —
  # Impact and Arial are Monotype commercial faces and are not embedded.
  # `Noto Sans SC Display` registers the bundled Bold file alone, so a
  # Chinese run inside an Anton heading lands on bold Han. IBM Plex Mono stays
  # for addresses, hashes and code. Noto Sans SC ships as three static
  # instances subset to the GB2312 repertoire plus CJK and fullwidth
  # punctuation (decision 0069).
  fonts:
    - family: Anton
      fonts:
        - asset: assets/fonts/Anton-Regular.ttf
          weight: 400
    - family: Arimo
      fonts:
        - asset: assets/fonts/Arimo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Arimo-Bold.ttf
          weight: 700
    - family: Noto Sans SC Display
      fonts:
        - asset: assets/fonts/NotoSansSC-Bold.ttf
          weight: 700
    - family: Noto Sans SC
      fonts:
        - asset: assets/fonts/NotoSansSC-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansSC-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSansSC-Bold.ttf
          weight: 700
    - family: IBM Plex Mono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexMono-SemiBold.ttf
          weight: 600
