name: loop_mobile
description: LOOP Flutter mobile client skeleton.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.13.1 <4.0.0'

dependencies:
  connectivity_plus: 7.3.1
  decimal: 3.2.6
  dio: 5.11.0
  flutter:
    sdk: flutter
  cupertino_icons: 1.0.8
  firebase_core: 4.13.0
  firebase_messaging: 16.5.0
  flutter_secure_storage: 10.3.1
  flutter_riverpod: 3.4.2
  go_router: 17.5.0
  privy_flutter: 0.10.1
  reown_appkit: 1.8.4
  share_plus: 12.0.2
  shared_preferences: 2.5.5
  stream_chat_flutter: 10.3.0
  stream_chat_persistence: 10.3.0
  stream_video_flutter: 1.4.3
  uuid: 4.6.0
  flutter_svg: 2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0

# sqlite3 v3 otherwise downloads a native artifact from GitHub during each
# cold build. Stream's pinned persistence graph already packages libsqlite3
# for Android, while Apple platforms provide it through the operating system.
hooks:
  user_defines:
    sqlite3:
      source: system

flutter:
  config:
    enable-swift-package-manager: false
  uses-material-design: true
  # Frozen prototype assets (docs/prototype, cliview.org loop-v2 build).
  assets:
    - assets/brand/
    - assets/tokens/
    - assets/networks/
    - assets/people/
    - assets/communities/
    - assets/icons/
  # Sora is a variable font; weights are selected through FontVariation
  # (see LoopTypography). IBM Plex Mono ships the three static weights the
  # prototype uses. Noto Sans SC is intentionally not bundled (17.7 MB); CJK
  # text falls back to the platform font stack. See decision 0051.
  fonts:
    - family: Sora
      fonts:
        - asset: assets/fonts/Sora-Variable.ttf
    - family: IBM Plex Mono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexMono-SemiBold.ttf
          weight: 600
